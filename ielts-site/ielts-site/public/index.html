<style>
:root{--n:#12352a;--b:#1fa463;--l:#e7f6ee;--ln:#e6ece9;--p:#8e1f9c}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0f172a;background:#f1f5f3;-webkit-font-smoothing:antialiased}

/* Umumiy elementlar */
header{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,#0f1b3d,#243a9c);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 6px 24px #0f1b3d30}
header b{letter-spacing:.08em}
.wrap{max-width:1120px;margin:28px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:22px;margin-bottom:18px;overflow:auto}
.hero{background:linear-gradient(135deg,#eef1ff,#fff);padding:36px}
.hero h2{font-size:28px;margin:0 0 8px;line-height:1.2}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
h3,h4{margin:.2em 0 .5em}
input,select,textarea,button{font:inherit;padding:11px 14px;border-radius:10px;border:1px solid #d5dbe7;width:100%;margin:5px 0;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus{outline:3px solid #3b5bfd30;border-color:var(--b)}
button{width:auto;background:var(--b);color:#fff;border:0;cursor:pointer;font-weight:600;transition:.15s}
button.s{background:#eaeef6;color:#1e293b}
header button.s{background:#ffffff26;color:#fff}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}

/* Jadvallar va teglar */
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#64748b;background:#f6faf8}
td,th{padding:12px 10px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
tr:hover td{background:#f8faff}
.tag{padding:3px 11px;border-radius:99px;background:var(--l);color:#12804b;font-size:12px;font-weight:600}
.ok{color:#15803d}.no{color:#b91c1c}

/* Imtihon oynasi */
.exam{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;z-index:9}
.bar{background:linear-gradient(120deg,#5b0f6e,#9b1fa1);color:#fff;padding:10px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar button{margin:0}
.bar b{margin-left:auto;font-size:20px;font-variant-numeric:tabular-nums}
#tm.low{color:#ff8a8a;animation:p 1s infinite}@keyframes p{50%{opacity:.4}}
.split{flex:1;display:flex;overflow:hidden;background:#f5f7fb}
.split>div{flex:1;overflow:auto;padding:22px;font-size:16px;line-height:1.7}
.split>div:first-child{background:#fff;border-right:1px solid var(--ln)}
.split.ls{flex-direction:column}
.split.ls>div:first-child{flex:none;max-height:32%;border-right:0;border-bottom:1px solid var(--ln);padding:12px 22px}
.split.ls>div:last-child{flex:1}
.nav{padding:10px 14px;border-top:1px solid var(--ln);display:flex;gap:6px;flex-wrap:wrap;background:#fff}
.nav a{padding:5px 12px;border-radius:99px;background:#eaeef6;cursor:pointer;font-weight:600;font-size:13px}
.nav a.d{background:var(--b);color:#fff}
mark{background:#fde047;cursor:pointer}
.exam input[type=text],.exam select{width:auto;display:inline-block;margin:2px;padding:6px 10px}
.grp{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:16px}
.ins{color:#475569;font-style:italic}.q{margin:12px 0}
.qn{display:inline-block;min-width:26px;text-align:center;background:var(--n);color:#fff;border-radius:8px;font-weight:700;font-size:13px;padding:1px 6px;margin-right:6px}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;margin:4px 0;border:1px solid var(--ln);border-radius:10px;cursor:pointer}
.opts label:hover{background:var(--l)}
.opts input{width:auto;margin:3px 0}
.box{background:var(--l);border-radius:10px;padding:10px 14px;margin:8px 0}
.au{background:var(--l);border-radius:12px;padding:12px 16px;margin-bottom:12px}

/* Asosiy layout va Sidebar */
.shell{display:flex;min-height:100vh;padding:16px;gap:16px}
.side{width:244px;flex:none;background:#fff;border-radius:22px;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:16px;height:calc(100vh - 32px);box-shadow:0 2px 12px #0f172a0f;border:1px solid var(--ln)}
.side small{color:#94a3b8;font-weight:700;letter-spacing:.08em;margin:14px 10px 6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.02em;color:var(--p);padding:4px 8px 12px}
.logo i{font-style:normal;background:linear-gradient(135deg,#8b5cf6,#6c3df4);color:#fff;border-radius:12px;width:38px;height:38px;display:grid;place-items:center}
.logo img{width:40px;height:40px;border-radius:50%}
.ni{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:600;color:#334155}
.ni span{width:32px;height:32px;border-radius:10px;background:#f1f5f3;display:grid;place-items:center}
.ni:hover{background:#f4faf7}
.ni.on{background:var(--l);color:#12804b}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--ln);border-radius:14px}
.me button{margin:0 0 0 auto;padding:6px 10px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#34d399,#1fa463);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
main{flex:1;min-width:0;background:transparent;box-shadow:none;padding:0}
.top{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px 20px;margin-bottom:16px}
.top h2{margin:0;font-size:20px}
.top button{margin:0 0 0 10px;padding:6px 12px}

/* Dashboard va Statistikalar */
.g3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:18px}
.st{position:relative;background:#fff;border:1px solid var(--ln);border-radius:18px;padding:18px;min-height:130px}
.st h1{margin:4px 0;font-size:34px}.mut{color:#64748b;margin:6px 0 0}
.ring{--p:0;position:absolute;right:18px;top:18px;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--b) calc(var(--p)*1%),#e3ece7 0);display:grid;place-items:center}
.ring:before{content:'';position:absolute;inset:9px;background:#fff;border-radius:50%}.ring b{position:relative}
.bars{display:flex;align-items:flex-end;gap:8px;height:56px;margin-top:8px}.bars i{flex:1;border-radius:99px;background:var(--b)}
.mk{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:12px;align-items:center;padding:14px;background:#fff;border:1px solid var(--ln);border-radius:16px;margin-bottom:10px}
.sec{display:flex;flex-direction:column;gap:6px;font-weight:600;text-transform:capitalize}
.note{background:var(--l);padding:12px 16px;border-radius:12px;margin-bottom:16px;font-weight:600;color:#12804b}
.land{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.lh{background:linear-gradient(150deg,#5b0f6e,#9b1fa1);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center}
.lh h1{font-size:40px;line-height:1.15}.lh .logo{color:#fff}.lh .logo img{width:64px;height:64px}
.lf{padding:40px;display:flex;flex-direction:column;justify-content:center;max-width:520px}
.dg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.dg>div{display:flex;flex-direction:column;gap:16px;min-width:0}.dg .card{margin:0}
.hero2{background:linear-gradient(120deg,#1fa463,#34d399);color:#fff;border-radius:18px;padding:22px 26px}
.hero2 h2{margin:0 0 4px;font-size:24px}.hero2 p{margin:0;opacity:.92}
.pb{height:8px;border-radius:9px;background:#ffffff40;margin-top:14px;overflow:hidden}.pb i{display:block;height:100%;background:#fff;border-radius:9px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.sc{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px}
.sc h2{margin:8px 0 0;font-size:24px}.sc small{color:#64748b}.sc .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px}
.tabs{display:flex;gap:6px;margin:6px 0 10px}.tabs a{padding:5px 12px;border-radius:99px;background:#eef3f0;cursor:pointer;font-size:13px;font-weight:600}.tabs a.d{background:var(--b);color:#fff}
.cal .ch{display:flex;justify-content:space-between;align-items:center}.cal .ch button{margin:0;padding:2px 10px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:8px;font-size:13px}
.cg small{color:#94a3b8}.cg span{padding:5px 0;border-radius:50%}.cg span.on{background:var(--b);color:#fff;font-weight:700}.cg span.td{outline:2px solid var(--p)}
.bg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}.bg div{font-size:11px}
.bg b{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 4px;border-radius:50%;border:2px solid var(--b);font-size:20px}.bg .off{filter:grayscale(1);opacity:.4}
.qs{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.qs:last-child{border:0}.qs button{margin:0}

/* Dark Mode */
body.dk{--ln:#27332e;background:#0e1512;color:#e5ece8}
.dk .side,.dk .top,.dk .card,.dk .sc,.dk .mk,.dk .st{background:#16201b}
.dk .ni{color:#cbd5d0}.dk .ni span,.dk .tabs a{background:#1f2b25}
.dk th{background:#1b2721}.dk tr:hover td{background:#1b2721}.dk .logo{color:#e9a6f2}.dk button.s{background:#223029;color:#e5ece8}
.dk input,.dk select,.dk textarea{background:#1f2b25;color:#e5ece8;border-color:#2c3b34}
.dk .exam{color:#0f172a}.dk .exam input,.dk .exam select,.dk .exam textarea{background:#fff;color:#0f172a;border-color:#d5dbe7}

/* Mobil moslashuvchanlik */
@media(max-width:1100px){.dg{grid-template-columns:1fr}}
@media(max-width:900px){.shell{flex-direction:column;padding:10px}.side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}.side small{display:none}.me{margin:0 0 0 auto}.land{grid-template-columns:1fr}.lh{padding:32px}.mk{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.split{flex-direction:column}header{padding:12px 16px}}

/* Kirish (Intro) Video */
#intro-overlay{position:fixed;inset:0;background:#140524;z-index:99999;display:flex;align-items:center;justify-content:center;transition:opacity .7s ease,visibility .7s ease}
#intro-overlay.hide{opacity:0;visibility:hidden}
#intro-overlay video{width:min(85vw,480px);height:auto;border-radius:24px;box-shadow:0 0 60px rgba(142,31,156,.45)}
#skip-intro{position:absolute;bottom:24px;right:24px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:8px 16px;border-radius:99px;font-size:13px;backdrop-filter:blur(6px)}
</style>
</head>
<body>

<div id="intro-overlay">
  <video id="intro-video" src="./intro.mp4" autoplay muted playsinline preload="auto"></video>
  <button id="skip-intro" onclick="closeIntro()">O'tkazib yuborish →</button>
</div>

<div id="app"></div>

<script>
const overlay = document.getElementById('intro-overlay');
const video = document.getElementById('intro-video');
let fallbackTimer;

function closeIntro() {
  clearTimeout(fallbackTimer);
  if (overlay) {
    overlay.classList.add('hide');
    setTimeout(() => overlay.remove(), 750);
  }
}

// Video to'liq tugaganda yopiladi
video.addEventListener('ended', closeIntro);

// Video haqiqatda o'ynashni boshlagandan keyingina zaxira taymer (5.5 soniya) ishga tushadi
video.addEventListener('playing', () => {
  clearTimeout(fallbackTimer);
  fallbackTimer = setTimeout(closeIntro, 5500);
});

// Agar fayl topilmasa yoki xatolik bersa yopiladi
video.addEventListener('error', closeIntro);

// Agar internet juda sekin bo'lib, video 12 soniya ichida ham yuklanmasa, sayt ochiladi
fallbackTimer = setTimeout(closeIntro, 12000);
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
