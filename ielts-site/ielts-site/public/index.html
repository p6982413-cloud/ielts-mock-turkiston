<style>
:root{--n:#0f1b3d;--b:#3b5bfd;--l:#eef1ff;--ln:#e6eaf2}*{box-sizing:border-box}
body{margin:0;font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0f172a;background:#f5f7fb;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,#0f1b3d,#243a9c);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 6px 24px #0f1b3d30}header b{letter-spacing:.08em}
.wrap{max-width:1120px;margin:28px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:22px;box-shadow:0 1px 2px #0f172a0d,0 12px 32px #0f172a0d;margin-bottom:18px;overflow:auto}
.hero{background:linear-gradient(135deg,#eef1ff,#fff);padding:36px}.hero h2{font-size:28px;margin:0 0 8px;line-height:1.2}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}h3,h4{margin:.2em 0 .5em}
input,select,textarea,button{font:inherit;padding:11px 14px;border-radius:10px;border:1px solid #d5dbe7;width:100%;margin:5px 0;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus{outline:3px solid #3b5bfd30;border-color:var(--b)}
button{width:auto;background:var(--b);color:#fff;border:0;cursor:pointer;font-weight:600;transition:.15s}button.s{background:#eaeef6;color:#1e293b}header button.s{background:#ffffff26;color:#fff}button:hover{filter:brightness(1.08);transform:translateY(-1px)}
table{width:100%;border-collapse:collapse}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#64748b}td,th{padding:12px 10px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}tr:hover td{background:#f8faff}
.tag{padding:3px 11px;border-radius:99px;background:var(--l);color:#2740c9;font-size:12px;font-weight:600}.ok{color:#15803d}.no{color:#b91c1c}
.exam{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;z-index:9}
.bar{background:linear-gradient(120deg,#0f1b3d,#243a9c);color:#fff;padding:10px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar button{margin:0}.bar b{margin-left:auto;font-size:20px;font-variant-numeric:tabular-nums}
#tm.low{color:#ff8a8a;animation:p 1s infinite}@keyframes p{50%{opacity:.4}}
.split{flex:1;display:flex;overflow:hidden;background:#f5f7fb}.split>div{flex:1;overflow:auto;padding:22px;font-size:16px;line-height:1.7}.split>div:first-child{background:#fff;border-right:1px solid var(--ln)}.split.ls{flex-direction:column}.split.ls>div:first-child{flex:none;max-height:32%;border-right:0;border-bottom:1px solid var(--ln);padding:12px 22px}.split.ls>div:last-child{flex:1}
.nav{padding:10px 14px;border-top:1px solid var(--ln);display:flex;gap:6px;flex-wrap:wrap;background:#fff}.nav a{padding:5px 12px;border-radius:99px;background:#eaeef6;cursor:pointer;font-weight:600;font-size:13px}.nav a.d{background:var(--b);color:#fff}
mark{background:#fde047;cursor:pointer}.exam input[type=text],.exam select{width:auto;display:inline-block;margin:2px;padding:6px 10px}
.grp{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:16px}.ins{color:#475569;font-style:italic}.q{margin:12px 0}
.qn{display:inline-block;min-width:26px;text-align:center;background:var(--n);color:#fff;border-radius:8px;font-weight:700;font-size:13px;padding:1px 6px;margin-right:6px}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;margin:4px 0;border:1px solid var(--ln);border-radius:10px;cursor:pointer}.opts label:hover{background:var(--l)}.opts input{width:auto;margin:3px 0}
.box{background:var(--l);border-radius:10px;padding:10px 14px;margin:8px 0}.au{background:var(--l);border-radius:12px;padding:12px 16px;margin-bottom:12px}
@media(max-width:800px){.split{flex-direction:column}header{padding:12px 16px}}
 
:root{--n:#1b1033;--b:#6c3df4;--l:#f0ebff;--ln:#ece8f6}body{background:#f4f1fb}
.shell{display:flex;min-height:100vh;padding:16px;gap:16px}
.side{width:244px;flex:none;background:#fff;border-radius:22px;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:16px;height:calc(100vh - 32px);box-shadow:0 8px 30px #6c3df414}
.side small{color:#94a3b8;font-weight:700;letter-spacing:.08em;margin:14px 10px 6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:4px 8px 12px}.logo i{font-style:normal;background:linear-gradient(135deg,#8b5cf6,#6c3df4);color:#fff;border-radius:12px;width:38px;height:38px;display:grid;place-items:center}
.ni{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:600;color:#334155}.ni span{width:32px;height:32px;border-radius:10px;background:#f4f1fb;display:grid;place-items:center}.ni:hover{background:#f7f4ff}.ni.on{background:var(--l);box-shadow:inset 0 0 0 1px #d9ccff;color:#4c1fd1}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--ln);border-radius:14px}.me button{margin:0 0 0 auto;padding:6px 10px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#6c3df4);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
main{flex:1;min-width:0;background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 30px #6c3df414}
.top{margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--ln)}.top h2{margin:0;font-size:24px}
.g3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:18px}
.st{position:relative;background:linear-gradient(160deg,#faf8ff,#fff);border:1px solid var(--ln);border-radius:18px;padding:18px;min-height:130px}.st h1{margin:4px 0;font-size:34px}.mut{color:#64748b;margin:6px 0 0}
.ring{--p:0;position:absolute;right:18px;top:18px;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--b) calc(var(--p)*1%),#ece8fb 0);display:grid;place-items:center}.ring:before{content:'';position:absolute;inset:9px;background:#fff;border-radius:50%}.ring b{position:relative}
.bars{display:flex;align-items:flex-end;gap:8px;height:56px;margin-top:8px}.bars i{flex:1;border-radius:99px;background:linear-gradient(#8b5cf6,#6c3df4)}
.card{box-shadow:none;border-radius:18px}th{background:#faf8ff}.tag{background:var(--l);color:#5b32d6}
.mk{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:12px;align-items:center;padding:14px;border:1px solid var(--ln);border-radius:16px;margin-bottom:10px}.sec{display:flex;flex-direction:column;gap:6px;font-weight:600;text-transform:capitalize}
.note{background:var(--l);padding:12px 16px;border-radius:12px;margin-bottom:16px;font-weight:600;color:#4c1fd1}
.land{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}.lh{background:linear-gradient(150deg,#4b21c4,#8b5cf6);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center}.lh h1{font-size:40px;line-height:1.15}.lf{padding:40px;display:flex;flex-direction:column;justify-content:center;max-width:520px}
.bar{background:linear-gradient(120deg,#1b1033,#5b32d6)}
@media(max-width:900px){.shell{flex-direction:column;padding:10px}.side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}.side small{display:none}.me{margin:0 0 0 auto}.land{grid-template-columns:1fr}.lh{padding:32px}.mk{grid-template-columns:1fr 1fr}}
 
:root{--n:#12352a;--b:#1fa463;--l:#e7f6ee;--ln:#e6ece9;--p:#8e1f9c}
body{background:#f1f5f3}
.side{box-shadow:0 2px 12px #0f172a0f;border:1px solid var(--ln)}
.logo{font-size:17px;letter-spacing:.02em;color:var(--p)}.logo img{width:40px;height:40px;border-radius:50%}
.ni span{background:#f1f5f3}.ni:hover{background:#f4faf7}.ni.on{background:var(--l);box-shadow:none;color:#12804b}
.av{background:linear-gradient(135deg,#34d399,#1fa463)}
main{background:transparent;box-shadow:none;padding:0}
.top{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px 20px;margin-bottom:16px}.top h2{font-size:20px}.top button{margin:0 0 0 10px;padding:6px 12px}
.card,.st,.mk{background:#fff}.card{border:1px solid var(--ln)}
th{background:#f6faf8}.tag{background:var(--l);color:#12804b}.note{background:var(--l);color:#12804b}
.ring{background:conic-gradient(var(--b) calc(var(--p)*1%),#e3ece7 0)}.bars i{background:var(--b)}
.lh{background:linear-gradient(150deg,#5b0f6e,#9b1fa1)}.lh .logo{color:#fff}.lh .logo img{width:64px;height:64px}
.bar{background:linear-gradient(120deg,#5b0f6e,#9b1fa1)}
.dg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.dg>div{display:flex;flex-direction:column;gap:16px;min-width:0}.dg .card{margin:0}
.hero2{background:linear-gradient(120deg,#1fa463,#34d399);color:#fff;border-radius:18px;padding:22px 26px}.hero2 h2{margin:0 0 4px;font-size:24px}.hero2 p{margin:0;opacity:.92}
.pb{height:8px;border-radius:9px;background:#ffffff40;margin-top:14px;overflow:hidden}.pb i{display:block;height:100%;background:#fff;border-radius:9px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.sc{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px}.sc h2{margin:8px 0 0;font-size:24px}.sc small{color:#64748b}.sc .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px}
.tabs{display:flex;gap:6px;margin:6px 0 10px}.tabs a{padding:5px 12px;border-radius:99px;background:#eef3f0;cursor:pointer;font-size:13px;font-weight:600}.tabs a.d{background:var(--b);color:#fff}
.cal .ch{display:flex;justify-content:space-between;align-items:center}.cal .ch button{margin:0;padding:2px 10px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:8px;font-size:13px}.cg small{color:#94a3b8}.cg span{padding:5px 0;border-radius:50%}.cg span.on{background:var(--b);color:#fff;font-weight:700}.cg span.td{outline:2px solid var(--p)}
.bg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}.bg div{font-size:11px}.bg b{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 4px;border-radius:50%;border:2px solid var(--b);font-size:20px}.bg .off{filter:grayscale(1);opacity:.4}
.qs{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.qs:last-child{border:0}.qs button{margin:0}
body.dk{--ln:#27332e;background:#0e1512;color:#e5ece8}.dk .side,.dk .top,.dk .card,.dk .sc,.dk .mk,.dk .st{background:#16201b}.dk .ni{color:#cbd5d0}.dk .ni span,.dk .tabs a{background:#1f2b25}.dk th{background:#1b2721}.dk tr:hover td{background:#1b2721}.dk .logo{color:#e9a6f2}.dk button.s{background:#223029;color:#e5ece8}
.dk input,.dk select,.dk textarea{background:#1f2b25;color:#e5ece8;border-color:#2c3b34}.dk .exam{color:#0f172a}.dk .exam input,.dk .exam select,.dk .exam textarea{background:#fff;color:#0f172a;border-color:#d5dbe7}

const dkey=t=>{if(!t?.toDate)return '';const d=t.toDate(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())},

 const [a,s,ms,r]=await Promise.all([col('attempts'),col('students'),col('mocks'),col('results')]);
 RD={N:{},G:{},M:{},A:[]};s.forEach(d=>{RD.N[d.id]=d.data().name;RD.G[d.id]=d.data().group||''});ms.forEach(d=>RD.M[d.id]=d.data());
 RES={};r.forEach(d=>RES[d.id]=d.data());
 ATT={};a.forEach(d=>{ATT[d.id]={id:d.id,...d.data()}});RD.A=Object.values(ATT);
 RK=await col('keys').then(k=>{const o={};k.forEach(d=>o[d.id]=d.data().map||{});return o}).catch(async()=>{const o={};for(const m of ms.docs)for(const t of ['listening','reading']){const d=await getDoc(doc(db,'keys',m.id+'_'+t)).catch(()=>null);if(d&&d.exists())o[d.id]=d.data().map||{}}return o})}
/* bitta urinishni kalit bilan tekshirish */
const grade=at=>{const k=RK[at.sectionId];if(!k)return null;const a=at.answers||{},nums=Object.keys(k).map(Number).sort((x,y)=>x-y);let c=0,w=0,b=0;
 const rows=nums.map(n=>{const g=norm(a[n]),ok=!!g&&k[n].includes(g);g?(ok?c++:w++):b++;return{n,given:a[n]||'',key:k[n].join(' / '),ok,blank:!g}});
 return{rows,c,w,b,tot:nums.length,bd:band(c,nums.length||40)}};
/* bo'lim bahosi: {st:-|prog|wait|ok, band, auto, g} */
const sb=at=>{if(!at)return{st:'-'};if(at.status!=='submitted')return{st:'prog'};const r=RES[at.id];
 if(at.type=='writing')return r?.band!=null?{st:'ok',band:r.band}:{st:'wait'};
 const g=grade(at);if(r?.band!=null)return{st:'ok',band:r.band,g};return g?{st:'ok',band:g.bd,auto:1,g}:{st:'wait'}};
const ovl=g=>{const b=SEC.map(t=>sb(g.S[t]).band);return b.every(x=>x!=null)?Math.round(b.reduce((x,y)=>x+y)/3*2)/2:null};
const cell2=at=>{const s=sb(at);if(s.st=='-')return '<span class=mut>—</span>';if(s.st=='prog')return '<span class=tag>Jarayonda</span>';if(s.st=='wait')return '<span class=tag>Baholanmagan</span>';
 return `<b>${s.band}</b>${s.g?` <small>${s.g.c}/${s.g.tot}</small>`:''}${s.auto?' <small>*</small>':''}`};

 RD.A.forEach(a=>{if(mock&&a.mockId!=mock)return;if(date&&dkey(a.startedAt)!=date)return;const k=a.uid+'|'+a.mockId,g=G[k]=G[k]||{uid:a.uid,mockId:a.mockId,t:0,d:'',S:{}};g.S[a.type]=a;const t=a.startedAt?.toMillis?.()||0;if(t>=g.t){g.t=t;g.d=dkey(a.startedAt)}});
 return Object.values(G).filter(g=>norm((RD.N[g.uid]||'')+' '+(RD.G[g.uid]||'')).includes(norm(q))).sort((x,y)=>y.t-x.t||String(RD.N[x.uid]).localeCompare(String(RD.N[y.uid])))}
